<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">Metric Calendar annual rhythm</title>
<desc id="desc">A horizontal model of 10 metric months and the repeating focus/rest rhythm.</desc>
<defs>
<style>
  .bg{fill:#fbfaf7}
  .card{fill:#fff;stroke:#d8dde8;stroke-width:2}
  .focus{fill:#edf2fa;stroke:#cad5e8;stroke-width:1}
  .rest{fill:#f6f1e7;stroke:#e4d6aa;stroke-width:1}
  .bonus{fill:#d9a441;stroke:#aa7a19;stroke-width:1}
  .navy{fill:#0b1f3a}
  .muted{fill:#5b6472}
  .h1{font-family:Inter,Aptos,Arial,sans-serif;font-size:42px;font-weight:850;fill:#0b1f3a}
  .sub{font-family:Inter,Aptos,Arial,sans-serif;font-size:20px;font-weight:600;fill:#5b6472}
  .label{font-family:Inter,Aptos,Arial,sans-serif;font-size:16px;font-weight:850;fill:#0b1f3a}
  .small{font-family:Inter,Aptos,Arial,sans-serif;font-size:13px;font-weight:700;fill:#5b6472}
</style>
<g id="week">
  <rect x="0" y="0" width="10" height="10" rx="2" class="focus"/><rect x="15" y="0" width="10" height="10" rx="2" class="focus"/><rect x="30" y="0" width="10" height="10" rx="2" class="focus"/><rect x="45" y="0" width="10" height="10" rx="2" class="focus"/><rect x="60" y="0" width="10" height="10" rx="2" class="rest"/><rect x="75" y="0" width="10" height="10" rx="2" class="rest"/>
</g>
</defs>
<rect class="bg" width="1500" height="760" rx="32"/>
<text x="60" y="70" class="h1">Annual rhythm</text>
<text x="60" y="106" class="sub">Each metric month contains six complete metric weeks. Every second month adds a Bonus Rest Day.</text>

<g transform="translate(60 145)">
  <rect x="0" y="0" width="20" height="20" rx="5" class="focus"/><text x="32" y="16" class="small">Focus/Work Day</text>
  <rect x="180" y="0" width="20" height="20" rx="5" class="rest"/><text x="212" y="16" class="small">Rest Day</text>
  <rect x="315" y="0" width="20" height="20" rx="5" class="bonus"/><text x="347" y="16" class="small">Bonus Rest Day</text>
</g>

<g transform="translate(60 205)">
  <g transform="translate(0 0)">
    <rect class="card" width="130" height="350" rx="22"/><text x="18" y="34" class="label">Month 01</text><text x="18" y="58" class="small">36 days</text>
    <g transform="translate(22 92)"><use href="#week"/><use href="#week" y="26"/><use href="#week" y="52"/><use href="#week" y="78"/><use href="#week" y="104"/><use href="#week" y="130"/></g>
    <text x="18" y="310" class="small">6 metric weeks</text>
  </g>
  <g transform="translate(145 0)">
    <rect class="card" width="130" height="350" rx="22"/><text x="18" y="34" class="label">Month 02</text><text x="18" y="58" class="small">37 days</text>
    <g transform="translate(22 92)"><use href="#week"/><use href="#week" y="26"/><use href="#week" y="52"/><use href="#week" y="78"/><use href="#week" y="104"/><use href="#week" y="130"/><rect x="35" y="166" width="18" height="18" rx="4" class="bonus"/></g>
    <text x="18" y="300" class="small">37th Day:<tspan x="18" dy="17">Bonus Rest Day</tspan></text>
  </g>
  <g transform="translate(290 0)">
    <rect class="card" width="130" height="350" rx="22"/><text x="18" y="34" class="label">Month 03</text><text x="18" y="58" class="small">36 days</text>
    <g transform="translate(22 92)"><use href="#week"/><use href="#week" y="26"/><use href="#week" y="52"/><use href="#week" y="78"/><use href="#week" y="104"/><use href="#week" y="130"/></g>
    <text x="18" y="310" class="small">6 metric weeks</text>
  </g>
  <g transform="translate(435 0)">
    <rect class="card" width="130" height="350" rx="22"/><text x="18" y="34" class="label">Month 04</text><text x="18" y="58" class="small">37 days</text>
    <g transform="translate(22 92)"><use href="#week"/><use href="#week" y="26"/><use href="#week" y="52"/><use href="#week" y="78"/><use href="#week" y="104"/><use href="#week" y="130"/><rect x="35" y="166" width="18" height="18" rx="4" class="bonus"/></g>
    <text x="18" y="300" class="small">37th Day:<tspan x="18" dy="17">Bonus Rest Day</tspan></text>
  </g>
  <g transform="translate(580 0)">
    <rect class="card" width="130" height="350" rx="22"/><text x="18" y="34" class="label">Month 05</text><text x="18" y="58" class="small">36 days</text>
    <g transform="translate(22 92)"><use href="#week"/><use href="#week" y="26"/><use href="#week" y="52"/><use href="#week" y="78"/><use href="#week" y="104"/><use href="#week" y="130"/></g>
    <text x="18" y="310" class="small">6 metric weeks</text>
  </g>
  <g transform="translate(725 0)">
    <rect class="card" width="130" height="350" rx="22"/><text x="18" y="34" class="label">Month 06</text><text x="18" y="58" class="small">37 days</text>
    <g transform="translate(22 92)"><use href="#week"/><use href="#week" y="26"/><use href="#week" y="52"/><use href="#week" y="78"/><use href="#week" y="104"/><use href="#week" y="130"/><rect x="35" y="166" width="18" height="18" rx="4" class="bonus"/></g>
    <text x="18" y="300" class="small">37th Day:<tspan x="18" dy="17">Bonus Rest Day</tspan></text>
  </g>
  <g transform="translate(870 0)">
    <rect class="card" width="130" height="350" rx="22"/><text x="18" y="34" class="label">Month 07</text><text x="18" y="58" class="small">36 days</text>
    <g transform="translate(22 92)"><use href="#week"/><use href="#week" y="26"/><use href="#week" y="52"/><use href="#week" y="78"/><use href="#week" y="104"/><use href="#week" y="130"/></g>
    <text x="18" y="310" class="small">6 metric weeks</text>
  </g>
  <g transform="translate(1015 0)">
    <rect class="card" width="130" height="350" rx="22"/><text x="18" y="34" class="label">Month 08</text><text x="18" y="58" class="small">37 days</text>
    <g transform="translate(22 92)"><use href="#week"/><use href="#week" y="26"/><use href="#week" y="52"/><use href="#week" y="78"/><use href="#week" y="104"/><use href="#week" y="130"/><rect x="35" y="166" width="18" height="18" rx="4" class="bonus"/></g>
    <text x="18" y="300" class="small">37th Day:<tspan x="18" dy="17">Bonus Rest Day</tspan></text>
  </g>
  <g transform="translate(1160 0)">
    <rect class="card" width="130" height="350" rx="22"/><text x="18" y="34" class="label">Month 09</text><text x="18" y="58" class="small">36 days</text>
    <g transform="translate(22 92)"><use href="#week"/><use href="#week" y="26"/><use href="#week" y="52"/><use href="#week" y="78"/><use href="#week" y="104"/><use href="#week" y="130"/></g>
    <text x="18" y="310" class="small">6 metric weeks</text>
  </g>
  <g transform="translate(1305 0)">
    <rect class="card" width="130" height="350" rx="22"/><text x="18" y="34" class="label">Month 10</text><text x="18" y="58" class="small">37 / 38</text>
    <g transform="translate(22 92)"><use href="#week"/><use href="#week" y="26"/><use href="#week" y="52"/><use href="#week" y="78"/><use href="#week" y="104"/><use href="#week" y="130"/><rect x="26" y="166" width="18" height="18" rx="4" class="bonus"/><rect x="50" y="166" width="18" height="18" rx="4" class="bonus" opacity=".55"/></g>
    <text x="18" y="300" class="small">New Year’s Eve<tspan x="18" dy="17">37 or 38</tspan></text>
  </g>
</g>
<rect x="60" y="610" width="1380" height="84" rx="26" fill="#0b1f3a"/>
<text x="95" y="647" font-family="Inter,Aptos,Arial,sans-serif" font-size="24" font-weight="850" fill="#fff">Standard year: 240 Focus/Work Days · 120 Rest Days · 5 Bonus Rest Days</text>
<text x="95" y="678" font-family="Inter,Aptos,Arial,sans-serif" font-size="16" font-weight="650" fill="#d8dde8">Leap years add one final day: YYYY-10-38 · Leap Day / New Year’s Eve</text>
</svg>