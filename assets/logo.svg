<svg xmlns="http://www.w3.org/2000/svg" width="820" height="180" viewBox="0 0 820 180" role="img" aria-labelledby="title desc">
<title id="title">Metric Calendar logo</title>
<desc id="desc">A ten-segment circular mark with Metric Calendar wordmark.</desc>
<g transform="translate(92 90)">
  <circle r="54" fill="#f6f1e7" stroke="#0b1f3a" stroke-width="4"/>
  <g stroke-linecap="round" stroke-width="10">
    <line x1="0" y1="-72" x2="0" y2="-58" stroke="#d9a441" transform="rotate(0)"/>
    <line x1="0" y1="-72" x2="0" y2="-58" stroke="#0b1f3a" transform="rotate(36)"/>
    <line x1="0" y1="-72" x2="0" y2="-58" stroke="#0b1f3a" transform="rotate(72)"/>
    <line x1="0" y1="-72" x2="0" y2="-58" stroke="#0b1f3a" transform="rotate(108)"/>
    <line x1="0" y1="-72" x2="0" y2="-58" stroke="#0b1f3a" transform="rotate(144)"/>
    <line x1="0" y1="-72" x2="0" y2="-58" stroke="#d9a441" transform="rotate(180)"/>
    <line x1="0" y1="-72" x2="0" y2="-58" stroke="#0b1f3a" transform="rotate(216)"/>
    <line x1="0" y1="-72" x2="0" y2="-58" stroke="#0b1f3a" transform="rotate(252)"/>
    <line x1="0" y1="-72" x2="0" y2="-58" stroke="#0b1f3a" transform="rotate(288)"/>
    <line x1="0" y1="-72" x2="0" y2="-58" stroke="#d9a441" transform="rotate(324)"/>
  </g>
  <text x="0" y="-3" text-anchor="middle" font-family="Inter, Aptos, Arial, sans-serif" font-size="37" font-weight="800" fill="#0b1f3a">10</text>
  <text x="0" y="28" text-anchor="middle" font-family="Inter, Aptos, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b1f3a">×6</text>
</g>
<g transform="translate(190 62)">
  <text x="0" y="0" font-family="Inter, Aptos, Arial, sans-serif" font-size="44" font-weight="800" fill="#0b1f3a">Metric Calendar</text>
  <text x="2" y="42" font-family="Inter, Aptos, Arial, sans-serif" font-size="20" font-weight="600" fill="#6b7280">A better rhythm for the year</text>
</g>
</svg>